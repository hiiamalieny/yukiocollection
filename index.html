      // ==== React Components ====
      function YukioCard({ item, isOwned, onToggle }) {
        return React.createElement("div", {
          className: `p-4 rounded-3xl shadow cursor-pointer transition-all ${
            isOwned ? "bg-yukio-neon" : "bg-white"
          }`,
          onClick: () => onToggle(item.id)
        },
          React.createElement("img", { src: item.imageUrl, className: "w-full rounded-2xl mb-2" }),
          React.createElement("p", null, item.name)
        );
      }

      function App() {
        const [owned, setOwned] = React.useState([]);

        function toggle(id) {
          setOwned(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
        }
        
        return React.createElement("div", { className: "max-w-5xl mx-auto p-6" },
          React.createElement("h1", { className: "text-2xl font-bold mb-4" }, "YUKIO 收藏圖鑑"),
          React.createElement("div", { className: "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" },
            YUKIO_LIST.map(item =>
              React.createElement(YukioCard, {
                key: item.id, item,
                isOwned: owned.includes(item.id),
                onToggle: toggle
              })
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root"))
        .render(React.createElement(App));
